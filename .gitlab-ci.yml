stages:
  - build
  - test
  - deploy

build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - dotnet restore
    - dotnet build --no-restore
  artifacts:
    paths:
      - "**/bin/"
      - "**/obj/"
    expire_in: 1 hour
  only:
    - develop
    - production

test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - dotnet test --no-build
  only:
    - develop
    - production

deploy:
  stage: deploy
  script:
    - printf 'POSTGRES_DB=%s\nPOSTGRES_USER=%s\nPOSTGRES_PASSWORD=%s\nAPI_PORT=%s\nALLOWED_ORIGINS=%s\nJwt__Key=%s\nExamSettings__AccessPassword=%s\n' "$PROD_POSTGRES_DB" "$PROD_POSTGRES_USER" "$PROD_POSTGRES_PASSWORD" "$PROD_API_PORT" "$PROD_ALLOWED_ORIGINS" "$PROD_JWT_KEY" "$PROD_EXAM_ACCESS_PASSWORD" > .env
    - docker compose -p kyrgyztest-prod down
    - docker compose -p kyrgyztest-prod up --build -d
  only:
    - production
  tags:
    - self-hosted
  environment:
    name: production