<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Station Client</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
</head>
<body>
    <h2>Station Client</h2>

    <input type="number" id="stationNumber" placeholder="Station Number">
    <button onclick="connect()">Подключиться</button>

    <h3>Status:</h3>
    <div id="status">Not connected</div>

    <h3>Messages:</h3>
    <div id="messages"></div>

    <script>
        let connection = null;

        async function connect() {
            const stationNumber = document.getElementById("stationNumber").value;

            connection = new signalR.HubConnectionBuilder()
                .withUrl("http://localhost:8000/hub/station")
                .withAutomaticReconnect()
                .build();

            // Получение команды ExamOpened
            connection.on("ExamOpened", (examCode) => {
                addMessage("📘 Exam opened: " + examCode);
            });

            connection.on("ReceiveMessage", (msg) => {
                addMessage("📩 " + msg);
            });

            try {
                await connection.start();
                document.getElementById("status").innerText = "Connected";

                // Регистрируем станцию
                await connection.invoke("RegisterStation", parseInt(stationNumber));

                addMessage("✅ Station registered: " + stationNumber);
            } catch (err) {
                console.error(err);
                document.getElementById("status").innerText = "Error connecting";
            }
        }

        function addMessage(message) {
            const div = document.getElementById("messages");
            const p = document.createElement("p");
            p.innerText = message;
            div.appendChild(p);
        }
    </script>
</body>
</html>
