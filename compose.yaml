services:
  kyrgyztest_database:
    image: postgres:16
    restart: on-failure
    env_file:
      - '.env'
    ports:
      - "5432:5432"    

  kyrgyztest.api:
    build:
      context: .
      dockerfile: KyrgyzTest.API/Dockerfile

    ports:
      - '8000:8080'
    depends_on:
      - kyrgyztest_database
