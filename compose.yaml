services:
  kyrgyztest_database:
    image: postgres:16
    restart: on-failure
    env_file:
      - '.env'
    ports:
      - "5432:5432"    

  kyrgyztest.api:
    build:
      context: .
      dockerfile: KyrgyzTest.API/Dockerfile
    env_file:
      - '.env'
    ports:
      - '8000:8080'
    depends_on:
      - kyrgyztest_database
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=kyrgyztest_database;Port=5432;Database=kyrgyztest;Username=postgres;Password=postgres